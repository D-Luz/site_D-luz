{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<h1>Trocar senha</h1>
{% if g.usuario['trocar_senha'] %}<div class="aviso info">Primeiro acesso: escolha uma senha sua para continuar.</div>{% endif %}
<form method="post" class="ficha estreita">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="campo"><label for="atual">Senha atual</label><input type="password" id="atual" name="atual" autocomplete="current-password" required></div>
  <div class="campo"><label for="nova">Nova senha</label><input type="password" id="nova" name="nova" autocomplete="new-password" minlength="8" required>
    <div class="ajuda">Pelo menos 8 caracteres.</div></div>
  <div class="campo"><label for="confirmacao">Repita a nova senha</label><input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" required></div>
  <div class="acoes"><button>Salvar senha</button></div>
</form>
{% endblock %}
