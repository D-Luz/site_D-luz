{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="login cartao">
  <h1>Conferência de Caixa</h1>
  <p class="sub">Grupo Dluz · entre com seu usuário.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="login">Usuário</label>
    <input type="text" id="login" name="login" autocomplete="username" autofocus required>
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    <p><button class="btn" type="submit">Entrar</button></p>
  </form>
</div>
{% endblock %}
