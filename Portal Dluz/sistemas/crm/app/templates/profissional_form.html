{% extends "base.html" %}
{% block titulo %}Novo eletricista{% endblock %}
{% block conteudo %}
<h1>Novo eletricista</h1>
<form method="post" class="cartao">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <label for="busca-cliente">Já é cliente no ERP? Busque pelo nome (opcional; assim as compras dele contam sozinhas)</label>
  <input type="text" id="busca-cliente" data-preencher="1" data-url="{{ url_for('rotas.clientes_buscar') }}" autocomplete="off" style="width:100%"><ul id="busca-res" class="busca-res"></ul>
  <input type="hidden" id="cliente_codigo" name="cliente_codigo" value="{{ p.get('cliente_codigo') or '' }}">
  <input type="hidden" id="empresa" name="empresa" value="{{ p.get('empresa') or '' }}">
  <label for="nome">Nome</label><input type="text" id="nome" name="nome" value="{{ p.get('nome', '') }}" required style="width:100%">
  <div class="linha-form">
    <div><label for="telefone">WhatsApp (com DDD)</label><input type="text" id="telefone" name="telefone" value="{{ p.get('telefone', '') }}"></div>
    <div><label for="nascimento">Nascimento</label><input type="date" id="nascimento" name="nascimento" value="{{ p.get('nascimento') or '' }}"></div>
    <div><label for="cpf">CPF</label><input type="text" id="cpf" name="cpf" value="{{ p.get('cpf', '') }}"></div>
  </div>
  <label for="obs">Observações</label><textarea id="obs" name="obs" rows="3">{{ p.get('obs', '') }}</textarea>
  <p><button class="btn" type="submit">Cadastrar</button> <a class="btn sec" href="{{ url_for('rotas.profissionais') }}">Cancelar</a></p>
</form>
{% endblock %}
