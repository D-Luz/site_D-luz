{% extends "base.html" %}
{% block titulo %}Entrar - Aprovação de Pedidos{% endblock %}
{% block conteudo %}
  <h1>Entrar</h1>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form class="formulario formulario-estreito" method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}"
           autocomplete="username" required autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button type="submit">Entrar</button>
  </form>
{% endblock %}
